version: "3"

services:

  redis_pubsub:
    build:
      context: .
      dockerfile: Dockerfile
    image: allocation-image
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      - DB_HOST=postgres
      - DB_PASSWORD=abc123
      - REDIS_HOST=redis
      - EMAIL_HOST=mailhog
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/
    volumes:
      - ./src:/src
      - ./tests:/tests
    working_dir: /src
    entrypoint:
      - python
      - -m
      - allocation.entrypoints.redis_eventconsumer

  api:
    image: allocation-image
    restart: always
    depends_on:
      - redis_pubsub
      - mailhog
    environment:
      - DB_HOST=postgres
      - DB_PASSWORD=abc123
      - API_HOST=api
      - REDIS_HOST=redis
      - EMAIL_HOST=mailhog
      - PYTHONDONTWRITEBYTECODE=1
      - FLASK_APP=src.allocation.entrypoints.flask_app
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/
    volumes:
      - ./src:/src
      - ./tests:/tests
    working_dir: /src
    entrypoint:
      - flask
      - run
      - --host=0.0.0.0
      - --port=80
      - --reload
    ports:
      - "5005:80"

  postgres:
    image: postgres:11
    platform: linux/amd64
    environment:
      - POSTGRES_USER=allocation
      - POSTGRES_PASSWORD=abc123
    ports:
      - "54321:5432"

  redis:
    image: redis:alpine
    ports:
      - "63791:6379"

  mailhog:
    image: axllent/mailpit
    ports:
      - "11025:1025"
      - "18025:8025"
